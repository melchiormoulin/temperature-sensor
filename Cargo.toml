[package]
name = "temperature-sensor"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Export DS18B20 temperatures through Prometheus or OTLP"

[dependencies]
anyhow = "1.0.100"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "tracing"] }
clap = { version = "4.6.4", features = ["derive"] }
humantime = "2.3.0"
opentelemetry = { version = "0.32.0", default-features = false, features = ["metrics"] }
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["http-proto", "internal-logs", "metrics", "reqwest-blocking-client", "reqwest-rustls"] }
opentelemetry-prometheus = "0.32.0"
opentelemetry_sdk = { version = "0.32.1", default-features = false, features = ["internal-logs", "metrics"] }
prometheus = "0.14.0"
thiserror = "2.0.17"
tokio = { version = "1.53.1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["ansi", "env-filter", "fmt"] }

[dev-dependencies]
http-body-util = "0.1.3"
tempfile = "3.23.0"
tower = { version = "0.5.2", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
