services:
  temperature-sensor:
    build:
      context: .
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "9100:9100"
    command:
      - --device-root
      - /devices
    volumes:
      # Mount the master directory, which holds the probes as real directories.
      # /sys/bus/w1/devices holds only relative symlinks into this path, and
      # they resolve back through the bind mount into a loop inside the
      # container, so reads there fail with ELOOP.
      - /sys/devices/w1_bus_master1:/devices:ro
    environment:
      OTEL_METRICS_EXPORTER: "${OTEL_METRICS_EXPORTER:-otlp}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://localhost:4318}"
      OTEL_EXPORTER_OTLP_HEADERS: "${OTEL_EXPORTER_OTLP_HEADERS:-}"
      OTEL_EXPORTER_OTLP_METRICS_TIMEOUT: "${OTEL_EXPORTER_OTLP_METRICS_TIMEOUT:-10000}"
      OTEL_METRIC_EXPORT_INTERVAL: "${OTEL_METRIC_EXPORT_INTERVAL:-30000}"
      OTEL_SERVICE_NAME: "${OTEL_SERVICE_NAME:-fishtank-temperature-sensor}"
      RUST_LOG: "${RUST_LOG:-info}"
    stop_grace_period: 15s
